<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyric Lower Third • Christmas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Work+Sans:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pine: #0d1a13;
      --evergreen: #123424;
      --cranberry: #c83d38;
      --gold: #e0c27a;
      --glass: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
      font-family: 'Work Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .bar {
      position: relative;
      width: min(1200px, 96vw);
      padding: 14px 20px;
      border-radius: 14px;
      background:
        linear-gradient(135deg, rgba(0,0,0,0.18), rgba(0,0,0,0.12)),
        linear-gradient(135deg, var(--pine), var(--evergreen) 60%, #5a1c15);
      border: 1px solid var(--border);
      color: #f6f7fb;
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
      overflow: hidden;
    }
    .bar::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      pointer-events: none;
    }
    .accent {
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(105deg, rgba(224,194,122,0.4) 0 12px, transparent 12px 26px),
        repeating-linear-gradient(-105deg, rgba(200,61,56,0.32) 0 12px, transparent 12px 26px);
      mask: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 60%);
      opacity: 0.65;
      pointer-events: none;
    }
    .line {
      position: relative;
      margin: 0;
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      line-height: 1.4;
      text-align: center;
      letter-spacing: 0.02em;
      z-index: 1;
    }
    .ref {
      position: absolute;
      right: 14px;
      bottom: 10px;
      font-size: 0.9rem;
      color: rgba(246,247,251,0.8);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="accent" aria-hidden="true"></div>
    <p class="line" id="line1">Joy to the world, the Lord is come</p>
    <p class="line" id="line2">Let earth receive her King</p>
    <div class="ref" id="ref">Carol</div>
  </div>

  <script>
    // Replace text via OBS custom CSS/JS or edit directly below.
    const l1 = document.getElementById('line1');
    const l2 = document.getElementById('line2');
    const ref = document.getElementById('ref');
    // Example setter (uncomment to use programmatically):
    // l1.textContent = "New line 1";
    // l2.textContent = "New line 2";
    // ref.textContent = "Ref";
  </script>
</body>
</html>
