<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carol Scriptures Lower Third</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Work+Sans:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pine: #0d1a13;
      --evergreen: #123424;
      --cranberry: #c83d38;
      --gold: #e0c27a;
      --glass: rgba(255,255,255,0.1);
      --border: rgba(255,255,255,0.2);
      --text: #f6f7fb;
      --muted: rgba(246,247,251,0.82);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
      font-family: 'Work Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      overflow: hidden;
    }
    .bar {
      position: relative;
      width: min(1200px, 96vw);
      padding: 18px 22px 20px;
      border-radius: 16px;
      background:
        linear-gradient(135deg, #0b1611, #0f261c, #4d1a15),
        linear-gradient(135deg, rgba(224,194,122,0.32), rgba(200,61,56,0.26));
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 22px 46px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .bar::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      pointer-events: none;
    }
    .header-row {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }
    .ref {
      font-family: 'Marcellus', serif;
      letter-spacing: 0.08em;
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
    }
    .text {
      position: relative;
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: clamp(1rem, 2.6vw, 1.12rem);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="header-row">
      <div class="ref" id="ref">Isaiah 9:6–7</div>
    </div>
    <p class="text" id="verseText">For to us a child is born...</p>
  </div>

  <script>
    const verses = [
      {
        ref: "Isaiah 9:6–7",
        text: "For to us a child is born, to us a son is given; and the government shall be upon his shoulder, and his name shall be called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace. Of the increase of his government and of peace there will be no end..."
      },
      {
        ref: "Micah 5:2",
        text: "But you, O Bethlehem Ephrathah, who are too little to be among the clans of Judah, from you shall come forth for me one who is to be ruler in Israel, whose coming forth is from of old, from ancient days."
      },
      {
        ref: "Psalm 98:1–3",
        text: "Oh sing to the Lord a new song, for he has done marvelous things! His right hand and his holy arm have worked salvation for him. The Lord has made known his salvation; he has revealed his righteousness in the sight of the nations. He has remembered his steadfast love and faithfulness to the house of Israel. All the ends of the earth have seen the salvation of our God."
      },
      {
        ref: "Luke 2:8–14",
        text: "And in the same region there were shepherds out in the field, keeping watch over their flock by night. And an angel of the Lord appeared to them, and the glory of the Lord shone around them... “Fear not, for behold, I bring you good news of great joy... For unto you is born this day in the city of David a Saviour, who is Christ the Lord... Glory to God in the highest, and on earth peace among those with whom he is pleased!”"
      },
      {
        ref: "Matthew 2:1–2",
        text: "Wise men from the east came to Jerusalem, saying, “Where is he who has been born king of the Jews? For we saw his star when it rose and have come to worship him.”"
      },
      {
        ref: "Matthew 1:21",
        text: "“She will bear a son, and you shall call his name Jesus, for he will save his people from their sins.”"
      },
      {
        ref: "John 1:14",
        text: "And the Word became flesh and dwelt among us, and we have seen his glory, glory as of the only Son from the Father, full of grace and truth."
      }
    ];

    const refEl = document.getElementById('ref');
    const textEl = document.getElementById('verseText');
    let idx = 0;

    const show = (n) => {
      idx = (n + verses.length) % verses.length;
      refEl.textContent = verses[idx].ref;
      textEl.textContent = verses[idx].text;
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        show(idx - 1);
      }
      if (e.key === 'ArrowRight' || e.key === ' ') {
        show(idx + 1);
      }
    });

    // init
    show(0);
  </script>
</body>
</html>
