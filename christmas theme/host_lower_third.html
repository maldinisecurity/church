<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Lower Third • Christmas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Work+Sans:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pine: #0d1a13;
      --evergreen: #123424;
      --cranberry: #c83d38;
      --gold: #e0c27a;
      --border: rgba(255,255,255,0.2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: 12px;
      font-family: 'Work Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f6f7fb;
    }
    .badge {
      position: relative;
      min-width: 320px;
      max-width: 520px;
      padding: 12px 16px;
      border-radius: 14px;
      background:
        linear-gradient(135deg, rgba(0,0,0,0.2), rgba(0,0,0,0.08)),
        linear-gradient(135deg, var(--pine), var(--evergreen) 60%, #5a1c15);
      border: 1px solid var(--border);
      box-shadow: 0 16px 38px rgba(0,0,0,0.35);
      overflow: hidden;
    }
    .badge::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      pointer-events: none;
    }
    .top {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(224,194,122,0.22), rgba(200,61,56,0.22));
      border: 1px solid rgba(255,255,255,0.2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .name {
      margin: 0;
      font-family: 'Marcellus', serif;
      font-size: 1.2rem;
      letter-spacing: 0.04em;
    }
    .role {
      margin: 2px 0 0;
      color: rgba(246,247,251,0.85);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="badge">
    <div class="top">
      <span class="icon" aria-hidden="true">⭐</span>
      <div>
        <p class="name" id="host-name">Host Name</p>
        <p class="role" id="host-role">Role or Title</p>
      </div>
    </div>
  </div>

  <script>
    // Edit text here or via OBS overrides
    // document.getElementById('host-name').textContent = 'Jane Doe';
    // document.getElementById('host-role').textContent = 'Service Host';
  </script>
</body>
</html>
