<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You • Merry Christmas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Work+Sans:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pine: #0d1a13;
      --evergreen: #123424;
      --cranberry: #c83d38;
      --gold: #e0c27a;
      --muted: rgba(246,247,251,0.82);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 18% 14%, rgba(224,194,122,0.28), transparent 34%),
        radial-gradient(circle at 82% 14%, rgba(200,61,56,0.28), transparent 34%),
        linear-gradient(135deg, var(--pine), var(--evergreen) 52%, #5a1c15);
      color: #f6f7fb;
      font-family: 'Work Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      padding: 16px;
    }
    .card {
      width: min(960px, 96vw);
      padding: 28px;
      border-radius: 20px;
      background: linear-gradient(160deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 20px 46px rgba(0,0,0,0.36);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .card::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.06);
      pointer-events: none;
    }
    h1 {
      margin: 0 0 10px;
      font-family: 'Marcellus', serif;
      font-size: clamp(2rem, 4.5vw, 2.6rem);
      letter-spacing: 0.08em;
    }
    p {
      margin: 8px 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-top: 10px;
    }
    .note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.98rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Merry Christmas!</h1>
    <p>Thank you for worshipping with KICC Wolverhampton today.</p>
    <p>Visit the photo booth, say hello to the team, and stay connected through the week.</p>
    <div class="cta">Follow us • facebook.com/KICC-Wolverhampton</div>
    <p class="note">May His peace and joy fill your home.</p>
  </div>
</body>
</html>
