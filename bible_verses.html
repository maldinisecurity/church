<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Bible Verse Banner</title>
  <style>
    :root {
      --highlight: #f5c441;
      --highlight-soft: rgba(245, 196, 65, 0.14);
      --panel: rgba(7, 12, 24, 0.62);
      --panel-edge: rgba(255, 255, 255, 0.1);
      --tag: #1c3f83;
      --tag-text: #e8f1ff;
      --text: #f8fbff;
      --muted: rgba(248, 251, 255, 0.72);
      --shadow: 0 18px 52px rgba(0, 0, 0, 0.45);
      --font: "Poppins", "Segoe UI", "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: transparent;
      color: var(--text);
      font-family: var(--font);
      letter-spacing: 0.01em;
      overflow: hidden;
      position: relative;
      padding: 0 clamp(16px, 3vw, 48px) clamp(6px, 1.4vh, 18px);
    }
    .stage {
      position: relative;
      width: 100%;
      max-width: 1920px;
      z-index: 1;
      display: flex;
      justify-content: center;
    }
    .banner {
      width: 100%;
      max-width: 96vw;
      display: grid;
      grid-template-columns: clamp(180px, 18vw, 280px) 1fr;
      border-radius: 12px 12px 0 0;
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.42);
      transform: translateY(120%);
      opacity: 0;
      transition: transform 420ms cubic-bezier(0.35, 0.9, 0.25, 1), opacity 320ms ease;
      overflow: hidden;
    }
    .banner.is-active {
      transform: translateY(0);
      opacity: 1;
    }
    .banner__meta {
      background: linear-gradient(180deg, rgba(21, 35, 70, 0.8), rgba(9, 16, 32, 0.8));
      padding: clamp(14px, 1.9vw, 26px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(8px, 1vw, 16px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }
    .banner__meta::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(245, 196, 65, 0.18), transparent 60%);
      pointer-events: none;
      mix-blend-mode: screen;
    }
    .banner__tag {
      align-self: flex-start;
      background: linear-gradient(135deg, var(--highlight), #f7e07b);
      color: #1f2231;
      padding: 0.38em 1.2em;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: clamp(10px, 0.95vw, 14px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.38);
    }
    .banner__ref {
      font-size: clamp(14px, 1.3vw, 20px);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.4;
    }
    .banner__content {
      position: relative;
      padding: clamp(18px, 2.4vw, 30px) clamp(20px, 3vw, 40px);
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, rgba(19, 26, 46, 0.78), rgba(9, 12, 24, 0.74));
    }
    .banner__content::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(245, 196, 65, 0.18), transparent 55%);
      pointer-events: none;
    }
    .banner__text {
      position: relative;
      font-size: clamp(18px, 2.4vw, 30px);
      font-weight: 600;
      line-height: 1.28;
      letter-spacing: 0.02em;
      text-shadow: 0 16px 35px rgba(0, 0, 0, 0.45);
    }
    .banner__text::before {
      content: "";
      position: absolute;
      left: calc(-1 * clamp(12px, 1.6vw, 20px));
      top: clamp(4px, 0.6vw, 10px);
      bottom: clamp(4px, 0.6vw, 10px);
      width: clamp(4px, 0.45vw, 8px);
      border-radius: 999px;
      background: linear-gradient(180deg, var(--highlight), rgba(245, 196, 65, 0.2));
      box-shadow: 0 10px 22px rgba(245, 196, 65, 0.38);
    }
    .banner__text[data-empty="true"]::before {
      display: none;
    }
    .controls {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }
    .controls button {
      pointer-events: auto;
      background: none;
      border: none;
      color: transparent;
      width: clamp(60px, 10vw, 120px);
    }
    .assistive {
      position: fixed;
      inset: auto auto clamp(12px, 2vh, 24px) clamp(12px, 2vw, 24px);
      font-size: clamp(12px, 1vw, 15px);
      color: rgba(248, 251, 255, 0.55);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
    }
    @media (max-width: 1024px) {
      body {
        padding: 0 clamp(12px, 4vw, 32px) clamp(6px, 1.6vh, 16px);
      }
      .banner {
        grid-template-columns: clamp(150px, 26vw, 220px) 1fr;
        border-radius: 10px 10px 0 0;
      }
      .banner__text::before {
        left: calc(-1 * clamp(10px, 1.4vw, 16px));
      }
    }
    @media (max-width: 720px) {
      body {
        padding: 0 clamp(10px, 4vw, 24px) clamp(4px, 1.8vh, 12px);
      }
      .banner {
        grid-template-columns: 1fr;
        border-radius: 10px 10px 0 0;
      }
      .banner__meta {
        border-right: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        align-items: flex-start;
      }
      .banner__text::before {
        display: none;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .banner {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="banner" id="banner">
      <div class="banner__meta">
        <div class="banner__tag">Bible Verse</div>
        <div class="banner__ref" id="verseRef"></div>
      </div>
      <div class="banner__content">
        <div class="banner__text" id="verseText" data-empty="true"></div>
      </div>
    </div>
    <div class="controls" aria-hidden="true">
      <button type="button" id="prevBtn">Previous</button>
      <button type="button" id="nextBtn">Next</button>
    </div>
  </div>
  <div class="assistive">←/→ or Space to control • Hold Shift+Space to go back</div>

  <script>
    (function(){
      const raw = document.getElementById('versesData').textContent.trim();
      const verses = JSON.parse(raw);
      const verseRef = document.getElementById('verseRef');
      const verseText = document.getElementById('verseText');
      const banner = document.getElementById('banner');
      const nextBtn = document.getElementById('nextBtn');
      const prevBtn = document.getElementById('prevBtn');
      const params = new URLSearchParams(location.search);
      const startParam = params.get('start');
      let idx = 0;
      if(startParam){
        const parsed = parseInt(startParam, 10);
        if(!Number.isNaN(parsed)){
          idx = Math.min(Math.max(parsed - 1, 0), verses.length - 1);
        }
      }

      function update(index, animate = true){
        if(!verses.length){ return; }
        idx = (index + verses.length) % verses.length;
        const current = verses[idx];
        verseRef.textContent = current.ref || '';
        verseText.textContent = current.text || '';
        verseText.dataset.empty = String(!current.text);
        if(!animate){
          banner.classList.add('is-active');
          return;
        }
        banner.classList.remove('is-active');
        void banner.offsetWidth;
        banner.classList.add('is-active');
      }

      function next(){
        update(idx + 1);
      }
      function prev(){
        update(idx - 1);
      }

      nextBtn.addEventListener('click', (e)=>{
        e.preventDefault();
        next();
      });
      prevBtn.addEventListener('click', (e)=>{
        e.preventDefault();
        prev();
      });
      window.addEventListener('keydown', (e)=>{
        if(e.key === 'ArrowRight' || (e.key === ' ' && !e.shiftKey)){
          e.preventDefault();
          next();
        } else if(e.key === 'ArrowLeft' || (e.key === ' ' && e.shiftKey)){
          e.preventDefault();
          prev();
        }
      });

      update(idx, false);
    })();
  </script>
