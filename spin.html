<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Spinning Image with Text</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{
      box-sizing:border-box;
    }
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: "Poppins", Arial, sans-serif;
      perspective: 1500px;
      background: transparent;
      color: #f6f8ff;
      overflow: hidden;
    }
    .spin-stage{
      position: relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
    }
    .spin-box {
      width: 240px;
      height: 240px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: transparent;
      border: none;
      border-radius: 16px;
      box-shadow: none;
      padding: 0;
      backdrop-filter: none;
      perspective: 1400px;
    }
    .spin-box-inner {
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
      animation: spin3d 12s linear infinite;
      border-radius: 12px;
      border: none;
      position: relative;
    }
    .spin-box:hover .spin-box-inner{
      animation-duration: 18s;
    }
    .spin-box-inner img{
      width: 78%;
      height: 78%;
      object-fit: contain;
      filter: drop-shadow(0 14px 24px rgba(0,0,0,0.35));
    }
    .cube-caption{
      position:absolute;
      bottom: 14px;
      left:50%;
      transform: translateX(-50%);
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f6f8ff;
      text-shadow: 0 3px 12px rgba(0,0,0,0.45);
      pointer-events:none;
    }
    .spin-shadow{
      display:none;
    }
    @keyframes spin3d {
      0% {
        transform: rotateY(0deg);
      }
      100% {
        transform: rotateY(360deg);
      }
    }
    @media (max-width: 768px) {
      .spin-box {
        width: 180px;
        height: 180px;
      }
      .cube-caption{
        font-size: 0.85rem;
        letter-spacing: 0.06em;
        bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="spin-stage">
    <div class="spin-box">
      <div class="spin-box-inner">
        <img src="kicc.png" alt="KICC Logo">
        <div class="cube-caption" aria-label="Church Location">Wolverhampton</div>
      </div>
      <div class="spin-shadow" aria-hidden="true"></div>
    </div>
  </div>
</body>
</html>
